name: Scan macOS AArch64 Compatibility

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Apple official macOS IPSW URL (HTTP Range supported)'
        required: true
        default: 'https://updates.cdn-apple.com/2026SummerFCS/fullrestores/140-75212/A2A24B94-1FC1-45A3-93F7-C51B02AF1F4D/UniversalMac_26.6.2_25G83_Restore.ipsw'
      scan_target:
        description: 'Scan targets: kernel, system, or both'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - kernel
          - system

env:
  IPSW_APFS_FUSE_PATH: /usr/local/bin/apfs-fuse
  # Project version pins (docs/workstreams.md, extract_full_25G83.yml).
  IPSW_VERSION: '3.1.739'
  APFS_FUSE_REF: '66b86bd525e8cb90f9012543be89b1f092b75cf3'
  CAPSTONE_VERSION: '5.0.7'

jobs:
  scan-and-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Ubuntu Runner
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install System Dependencies & Build apfs-fuse
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libfuse3-dev zlib1g-dev libbz2-dev libattr1-dev libacl1-dev python3-pip curl jq
          echo "Cloning and building apfs-fuse from source..."
          git clone --recursive https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          git -C /tmp/apfs-fuse checkout --quiet --recurse-submodules "$APFS_FUSE_REF"
          echo "apfs-fuse commit: $(git -C /tmp/apfs-fuse rev-parse HEAD)"
          cmake --version | head -n 1
          g++ --version | head -n 1
          # Two pieces of runner toolchain drift. Both are fatal without these
          # flags and both were diagnosed on extract_full_25G83.yml; the same
          # two killed this workflow because it builds the same source.
          #
          # 1. CMAKE_POLICY_VERSION_MINIMUM: the image moved to CMake 4.x,
          #    which removed support for the old cmake_minimum_required
          #    apfs-fuse declares, so configure aborts with "Compatibility
          #    with CMake < 3.5 has been removed from CMake"
          #    (run 41037554980). This flag is the escape hatch CMake's own
          #    error message names.
          # 2. -include cstdint: the image's g++ (15.2) no longer pulls
          #    <cstdint> in transitively, and ApfsLib/PList.h uses uint8_t
          #    without including it, so PList.cpp fails with "uint8_t does
          #    not name a type" (run 41038815362). Force-including the header
          #    fixes every C++ translation unit at once with no upstream
          #    patch. C sources (3rdparty/lzfse) are untouched: C++ only.
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_CXX_FLAGS='-include cstdint'
          cmake --build /tmp/apfs-fuse/build -j "$(nproc)"
          sudo find /tmp/apfs-fuse/build -maxdepth 1 -type f -perm -u+x \
               \( -name 'apfs-*' -o -name 'apfsutil' \) -exec cp {} /usr/local/bin/ \;
          command -v apfs-fuse
          apfs-fuse -h || true

      - name: Install ipsw CLI & Capstone
        run: |
          # Pinned to the project's version pins. Floating on "latest" was a
          # second reproducibility hole next to the unpinned apfs-fuse above:
          # the decoder build decides the mnemonic census, and ipsw's CLI
          # surface has already moved under this workflow once ("ipsw kernel
          # dec -o" takes a directory, not a file - run 41043160466).
          pip3 install --break-system-packages "capstone==${CAPSTONE_VERSION}" \
            || pip3 install "capstone==${CAPSTONE_VERSION}"
          python3 -c "import capstone; print('capstone pkg', capstone.__version__, 'core', capstone.cs_version())"
          echo "Installing ipsw v${IPSW_VERSION}..."
          curl -fL --retry 3 -o ipsw.deb "https://github.com/blacktop/ipsw/releases/download/v${IPSW_VERSION}/ipsw_${IPSW_VERSION}_linux_x86_64.deb"
          sudo dpkg -i ipsw.deb
          ipsw version

      - name: Create Workspace Directories
        run: |
          mkdir -p /tmp/work/kernel
          mkdir -p /tmp/work/kernel/extracted
          mkdir -p /tmp/work/system_aea
          mkdir -p /tmp/work/system_dmg
          mkdir -p /tmp/work/mnt
          mkdir -p reports

      # ------------------------------------------------------------------------
      # Task A: Kernel Space (vma2 Guest Kernel)
      # ------------------------------------------------------------------------
      - name: Extract & Decompress vma2 Kernelcache
        if: ${{ inputs.scan_target == 'both' || inputs.scan_target == 'kernel' }}
        run: |
          echo ">>> [1/2] Fetching vma2 kernelcache remotely..."
          ipsw extract --remote "${{ inputs.ipsw_url }}" -k --pattern '.*vma2.*' -o /tmp/work/kernel
          
          KC_FILE=$(find /tmp/work/kernel -name "kernelcache.release.vma2" | head -n 1)
          if [ -n "$KC_FILE" ]; then
            echo "Decompressing kernelcache: $KC_FILE"
            ipsw kernel dec "$KC_FILE"
            mv "${KC_FILE}.decompressed" /tmp/work/kernel/kernelcache.vma2.dec
          else
            echo "[-] vma2 kernelcache not found in remote search, looking for any kernelcache..."
            KC_ALT=$(find /tmp/work/kernel -name "kernelcache.*" | head -n 1)
            ipsw kernel dec "$KC_ALT"
            mv "${KC_ALT}.decompressed" /tmp/work/kernel/kernelcache.vma2.dec
          fi

          echo "Extracting standalone Mach-O kernel and KEXTs for pristine analysis..."
          ipsw kernel extract /tmp/work/kernel/kernelcache.vma2.dec -o /tmp/work/kernel/extracted || true

      - name: Scan Kernel for Non-Standard Instructions
        if: ${{ inputs.scan_target == 'both' || inputs.scan_target == 'kernel' }}
        run: |
          echo ">>> Scanning vma2 Kernel (High-Performance)..."
          if [ -d "/tmp/work/kernel/extracted" ] && [ "$(ls -A /tmp/work/kernel/extracted 2>/dev/null)" ]; then
            echo "Scanning extracted standalone kernel & driver Mach-O files..."
            python3 -u scan_incompatible.py /tmp/work/kernel/extracted --json reports/kernel_incompatible.json | tee reports/kernel_report.txt
          else
            echo "Scanning fileset kernelcache directly..."
            python3 -u scan_incompatible.py /tmp/work/kernel/kernelcache.vma2.dec --json reports/kernel_incompatible.json | tee reports/kernel_report.txt
          fi

      # ------------------------------------------------------------------------
      # Task B: User Space (SystemOS AEA, Dyld Shared Caches & APFS Root)
      # ------------------------------------------------------------------------
      - name: Extract & Decrypt SystemOS AEA DMG
        if: ${{ inputs.scan_target == 'both' || inputs.scan_target == 'system' }}
        run: |
          echo ">>> [2/2] Fetching SystemOS DMG remotely..."
          ipsw extract --remote "${{ inputs.ipsw_url }}" --dmg sys -o /tmp/work/system_aea
          
          AEA_FILE=$(find /tmp/work/system_aea -name "*.dmg.aea" | head -n 1)
          if [ -n "$AEA_FILE" ]; then
            echo "Querying WKMS decryption key for $AEA_FILE..."
            KEY_RAW=$(ipsw fw aea -k "$AEA_FILE")
            KEY_VAL=$(echo "$KEY_RAW" | grep "base64:" | cut -d':' -f2)
            echo "Decryption Key retrieved successfully: $KEY_VAL"
            
            echo "Decrypting AEA archive..."
            ipsw fw aea "$AEA_FILE" -o /tmp/work/system_dmg --key-val "$KEY_VAL"
          else
            echo "SystemOS AEA not found; looking for unencrypted DMG..."
            find /tmp/work/system_aea -name "*.dmg" -exec mv {} /tmp/work/system_dmg/ \;
          fi

      - name: Mount APFS & Scan Userland Components
        if: ${{ inputs.scan_target == 'both' || inputs.scan_target == 'system' }}
        run: |
          DMG_FILE=$(find /tmp/work/system_dmg -name "*.dmg" | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            echo "Mounting APFS container: $DMG_FILE"
            sudo mkdir -p /tmp/work/mnt
            sudo apfs-fuse -o allow_other "$DMG_FILE" /tmp/work/mnt
            ls -la /tmp/work/mnt
            
            MNT_ROOT="/tmp/work/mnt"
            if [ -d "/tmp/work/mnt/root" ]; then
              MNT_ROOT="/tmp/work/mnt/root"
            fi
            
            echo "Scanning Userland (Dyld Shared Caches & ARM64 Mach-O binaries in $MNT_ROOT)..."
            python3 -u scan_incompatible.py "$MNT_ROOT" --json reports/userland_incompatible.json | tee reports/userland_report.txt
          else
            echo "No decrypted DMG found to mount."
          fi

      # ------------------------------------------------------------------------
      # Summary & Artifact Upload
      # ------------------------------------------------------------------------
      - name: Generate GitHub Actions Step Summary
        if: always()
        run: |
          echo "## 📊 macOS AArch64 Cloud Compatibility Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/kernel_report.txt ]; then
            echo "### 🐧 Kernel Space (vma2) Analysis" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -n 40 reports/kernel_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/userland_report.txt ]; then
            echo "### 📦 User Space Analysis" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -n 40 reports/userland_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Analysis Reports & JSON Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-compatibility-reports
          path: reports/
